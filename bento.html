<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fluid Mosaic</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    background: #0a0a0a; overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- ============ visible error reporting (no more silent black screens) ============ -->
<script>
  window.__fatal = function (msg) {
    var el = document.getElementById('__fatal');
    if (!el) {
      el = document.createElement('div');
      el.id = '__fatal';
      el.style.cssText = 'position:fixed;top:12px;left:12px;right:12px;z-index:9999;' +
        'font:12px/1.6 ui-monospace,Menlo,Consolas,monospace;color:#ffb4b4;background:#2a1215;' +
        'border:1px solid #7c2d2d;border-radius:8px;padding:10px 12px;white-space:pre-wrap;';
      (document.body || document.documentElement).appendChild(el);
    }
    el.textContent += msg + '\n';
  };
  window.addEventListener('error', function (e) {
    if (e.message) window.__fatal('⚠ ' + e.message);
  });
  window.addEventListener('error', function (e) {
    var t = e.target;
    if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) {
      window.__fatal('⚠ Failed to load: ' + (t.src || t.href));
    }
  }, true);
</script>

<script>window.process = { env: { NODE_ENV: 'production' } };</script>

<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js" crossorigin></script>

<!-- ============ load framer-motion (UMD) with CDN fallbacks, then boot ============ -->
<script>
  (function () {
    var URLS = [
      'https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js',
      'https://cdn.jsdelivr.net/npm/framer-motion@10.16.4/dist/framer-motion.js',
      'https://unpkg.com/framer-motion@6.5.1/dist/framer-motion.js',
      'https://cdn.jsdelivr.net/npm/framer-motion@6.5.1/dist/framer-motion.js'
    ];
    var present = function () {
      return !!(window.Motion || window.FramerMotion || window.framerMotion);
    };
    var done = false;
    function finish(fallback) {
      if (done) return;
      done = true;
      if (fallback) window.__fmFallback = true;
      window.__fmReady = true;
      if (window.__boot) window.__boot();
    }
    function attempt(i) {
      if (i >= URLS.length) {
        window.__fatal('⚠ framer-motion unavailable from all CDNs — using built-in spring fallback (grid still animates).');
        finish(true);
        return;
      }
      var s = document.createElement('script');
      s.src = URLS[i];
      s.onload = function () { present() ? finish(false) : attempt(i + 1); };
      s.onerror = function () { attempt(i + 1); };
      document.head.appendChild(s);
    }
    attempt(0);
  })();
</script>

<!-- ============ app (NOTE: no `export` here — module syntax breaks in-browser Babel) ============ -->
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;

const GAP = 10;
const SPRING = { type: 'spring', stiffness: 280, damping: 30, mass: 1 };
const getFM = () => window.Motion || window.FramerMotion || window.framerMotion || null;

/* ============================== CONFIG ============================== */

const TILES = {
  t01: { num: '01', cat: 'Portrait', title: 'Editorial',  tone: '#4d564b', pos: 'center',
         src: 'https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1600&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-editorial/1600/1200' },
  t02: { num: '02', cat: 'Study',    title: 'Form',       tone: '#b5a18e', pos: 'center',
         src: 'https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1400&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-form/1200/800' },
  t03: { num: '03', cat: 'Campaign', title: 'Motion',     tone: '#d9d2c7', pos: 'center',
         src: 'https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?q=80&w=1200&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-motion/900/1200' },
  t04: { num: '04', cat: 'Lookbook', title: 'Collection', tone: '#b08d6e', pos: 'center',
         src: 'https://images.unsplash.com/photo-1493809842364-78817add7ffb?q=80&w=1600&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-collection/1400/900' },
  t05: { num: '05', cat: 'Archive',  title: 'Objects',    tone: '#c69c85', pos: 'center 25%',
         src: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?q=80&w=1000&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-objects/900/1100' },
  t06: { num: '06', cat: 'Series',   title: 'Volume',     tone: '#ccd2d6', pos: 'center',
         src: 'https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?q=80&w=1400&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-volume/1200/800' },
  t07: { num: '07', cat: 'Detail',   title: 'Material',   tone: '#6e7568', pos: 'center',
         src: 'https://images.unsplash.com/photo-1503602642458-232111445657?q=80&w=1200&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-material/1000/1000' },
  t08: { num: '08', cat: 'Story',    title: 'Afterlight', tone: '#7c1113', pos: 'center',
         src: 'https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&w=1200&auto=format&fit=crop',
         fb:  'https://picsum.photos/seed/mosaic-afterlight/1000/1000' },
};

/* Layout tree: every node has `base` flex and `hover` flex. Hovering a tile
   applies the hover weight to the tile AND every container containing it,
   so whole rows/columns expand and siblings fluidly shrink. */
const LAYOUT = decorate({
  children: [
    { key: 'top', type: 'row', base: 2.85, hover: 3.55, children: [
        { key: 't01', tile: 't01', base: 1,   hover: 1.32 },
        { key: 'right', type: 'column', base: 1, hover: 1.42, children: [
            { key: 'sub', type: 'row', base: 0.575, hover: 1.55, children: [
                { key: 't02', tile: 't02', base: 1.86, hover: 3.0 },
                { key: 't03', tile: 't03', base: 1,    hover: 1.9 },
            ]},
            { key: 't04', tile: 't04', base: 1, hover: 1.35 },
        ]},
    ]},
    { key: 'bottom', type: 'row', base: 1, hover: 2.55, children: [
        { key: 't05', tile: 't05', base: 1.05, hover: 2.35 },
        { key: 't06', tile: 't06', base: 1.82, hover: 3.2 },
        { key: 't07', tile: 't07', base: 1.86, hover: 3.2 },
        { key: 't08', tile: 't08', base: 1,    hover: 2.1 },
    ]},
  ],
});

function decorate(node) {
  if (node.tile) {
    node.data = TILES[node.tile];
    node.desc = new Set([node.tile]);
    return node;
  }
  node.desc = new Set();
  node.children.forEach((c) => decorate(c).desc.forEach((k) => node.desc.add(k)));
  return node;
}

const flexFor = (node, hovered) =>
  hovered && node.desc.has(hovered) ? node.hover : node.base;

/* ============================== PIECES ============================== */

function TileImage({ data }) {
  const [stage, setStage] = useState(0); // 0 = primary, 1 = fallback, 2 = hidden
  const [loaded, setLoaded] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    if (el && el.complete && el.naturalWidth > 0) setLoaded(true);
  }, [stage]);
  if (stage > 1) return null;
  return (
    <img
      ref={ref}
      src={stage === 0 ? data.src : data.fb}
      alt={data.num + ' — ' + data.title}
      draggable={false}
      onError={() => setStage((s) => s + 1)}
      onLoad={() => setLoaded(true)}
      style={{
        position: 'absolute', inset: 0, width: '100%', height: '100%',
        objectFit: 'cover', objectPosition: data.pos,
        opacity: loaded ? 1 : 0, transition: 'opacity .5s ease',
        userSelect: 'none',
      }}
    />
  );
}

/* Built-in spring engine — only used if framer-motion couldn't load */
function SpringDiv({ grow, style, onMouseEnter, onTouchStart, children }) {
  const ref = useRef(null);
  const val = useRef(grow), vel = useRef(0);
  useEffect(() => {
    let raf = 0;
    const target = grow;
    const tick = () => {
      vel.current = (vel.current + (target - val.current) * 0.14) * 0.8;
      val.current += vel.current;
      if (Math.abs(target - val.current) < 0.001 && Math.abs(vel.current) < 0.001) {
        val.current = target; vel.current = 0;
        if (ref.current) ref.current.style.flexGrow = String(val.current);
        return;
      }
      if (ref.current) ref.current.style.flexGrow = String(val.current);
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [grow]);
  return (
    <div ref={ref} onMouseEnter={onMouseEnter} onTouchStart={onTouchStart}
         style={Object.assign({}, style, { flexGrow: grow })}>
      {children}
    </div>
  );
}

/* Uses framer-motion when available, built-in springs otherwise */
function AnimDiv({ grow, style, onMouseEnter, onTouchStart, children }) {
  const fm = window.__fmFallback ? null : getFM();
  if (fm && fm.motion) {
    const M = fm.motion;
    return (
      <M.div
        initial={false}
        animate={{ flexGrow: grow }}
        transition={SPRING}
        onMouseEnter={onMouseEnter}
        onTouchStart={onTouchStart}
        style={style}
      >
        {children}
      </M.div>
    );
  }
  return (
    <SpringDiv grow={grow} style={style} onMouseEnter={onMouseEnter} onTouchStart={onTouchStart}>
      {children}
    </SpringDiv>
  );
}

function Tile({ node, hovered, onHover }) {
  const { data } = node;
  return (
    <AnimDiv
      grow={flexFor(node, hovered)}
      onMouseEnter={() => onHover(node.key)}
      onTouchStart={() => onHover((h) => (h === node.key ? null : node.key))}
      style={{
        position: 'relative', flexBasis: 0, minWidth: 0, minHeight: 0,
        overflow: 'hidden', borderRadius: 10, background: data.tone,
      }}
    >
      <TileImage data={data} />
      <div style={{
        position: 'absolute', inset: 0, zIndex: 1, pointerEvents: 'none',
        background: 'linear-gradient(to top, rgba(0,0,0,0.30), rgba(0,0,0,0) 40%)',
      }} />
      <div style={{ position: 'absolute', left: 0, bottom: 0, padding: 16, zIndex: 2, pointerEvents: 'none' }}>
        <div style={{ fontSize: 11, lineHeight: '15px', fontWeight: 400, letterSpacing: '-0.01em',
                      color: 'rgba(255,255,255,0.6)', whiteSpace: 'nowrap' }}>
          {data.num} / {data.cat}
        </div>
        <div style={{ fontSize: 11.5, lineHeight: '16px', fontWeight: 500, letterSpacing: '-0.01em',
                      color: '#fff', whiteSpace: 'nowrap', textShadow: '0 1px 10px rgba(0,0,0,0.25)' }}>
          {data.title}
        </div>
      </div>
    </AnimDiv>
  );
}

function MosaicNode({ node, hovered, onHover }) {
  if (node.tile) return <Tile node={node} hovered={hovered} onHover={onHover} />;
  return (
    <AnimDiv
      grow={flexFor(node, hovered)}
      style={{
        display: 'flex',
        flexDirection: node.type === 'column' ? 'column' : 'row',
        gap: GAP, flexBasis: 0, minWidth: 0, minHeight: 0, position: 'relative',
      }}
    >
      {node.children.map((c) => (
        <MosaicNode key={c.key} node={c} hovered={hovered} onHover={onHover} />
      ))}
    </AnimDiv>
  );
}

/* ============================== COMPONENT ============================== */

function FluidMosaic() {
  const [hovered, setHovered] = useState(null);
  return (
    <div
      onMouseLeave={() => setHovered(null)}
      style={{ position: 'fixed', inset: 0, padding: GAP, background: '#0a0a0a', display: 'flex' }}
    >
      <div style={{
        flex: 1, minWidth: 0, minHeight: 0, overflow: 'hidden',
        display: 'flex', flexDirection: 'column', gap: GAP,
        background: '#151515', borderRadius: 16, padding: GAP,
      }}>
        {LAYOUT.children.map((node) => (
          <MosaicNode key={node.key} node={node} hovered={hovered} onHover={setHovered} />
        ))}
      </div>
    </div>
  );
}

/* ---- boot: exactly one render, error-safe ---- */
if (!window.React || !window.ReactDOM) {
  window.__fatal('⚠ React failed to load — check your internet connection / ad-blocker and reload.');
} else {
  window.__boot = function () {
    if (window.__booted) return;
    window.__booted = true;
    try {
      ReactDOM.createRoot(document.getElementById('root')).render(<FluidMosaic />);
    } catch (err) {
      window.__fatal('⚠ Render error: ' + (err && err.message ? err.message : String(err)));
    }
  };
  if (window.__fmReady) window.__boot(); // loader may have finished before this script ran
}
</script>
</body>
</html>
